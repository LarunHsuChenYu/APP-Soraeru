<p class="font-body-target-md text-body-target-md text-on-surface-variant max-w-sm">透過 AI 將外語轉換為您熟悉的發音，輕鬆記憶每個新單字。</p>
</header>

<section class="px-gutter flex-grow flex flex-col gap-stack-gap">
<!-- Step 1 -->
<div class="bg-surface p-card-padding rounded-xl border border-outline-variant/30 flex items-start gap-4 shadow-sm relative overflow-hidden group hover:border-primary/20 transition-colors">

<div class="flex flex-col gap-1 z-10 pt-1">

<p class="font-caption text-caption text-on-surface-variant">直接輸入您想學的單字，或是拍下書本上的內容。</p>
</div>
</div>
<!-- Step 2 -->

</div>
</div>

<div class="w-8 h-8 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center font-label-mono text-label-mono shrink-0 font-bold z-10">3</div>
