<!DOCTYPE html>

<html class="light" lang="zh-TW"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Soraeru - Home</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Noto+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#e0e3e5",
                        "on-tertiary-container": "#ffcfa6",
                        "on-tertiary-fixed-variant": "#6b3b00",
                        "background": "#f7f9fc",
                        "on-primary-container": "#a2e1ff",
                        "tertiary-container": "#885116",
                        "on-tertiary-fixed": "#2d1600",
                        "error": "#ba1a1a",
                        "secondary": "#4d616c",
                        "tertiary-fixed-dim": "#ffb876",
                        "outline": "#70787e",
                        "surface-bright": "#f7f9fc",
                        "secondary-fixed": "#d0e6f3",
                        "status-warning": "#8B5000",
                        "surface-dim": "#d8dadd",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#eceef1",
                        "primary-fixed-dim": "#87d0f2",
                        "secondary-container": "#d0e6f3",
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-surface": "#181c1e",
                        "surface-container-high": "#e6e8eb",
                        "status-danger": "#BA1A1A",
                        "on-primary-fixed-variant": "#004d64",
                        "status-info": "#0061A4",
                        "on-secondary-fixed": "#081e27",
                        "surface-container-highest": "#e0e3e5",
                        "on-surface-variant": "#3f484d",
                        "on-secondary-fixed-variant": "#364954",
                        "outline-variant": "#bfc8cd",
                        "inverse-on-surface": "#eff1f3",
                        "primary-fixed": "#bee9ff",
                        "on-primary-fixed": "#001f2a",
                        "surface-container-low": "#f2f4f6",
                        "surface": "#f7f9fc",
                        "on-error": "#ffffff",
                        "on-secondary-container": "#536772",
                        "tertiary-fixed": "#ffdcc0",
                        "secondary-fixed-dim": "#b4cad6",
                        "inverse-primary": "#87d0f2",
                        "inverse-surface": "#2d3133",
                        "on-error-container": "#93000a",
                        "on-background": "#181c1e",
                        "on-secondary": "#ffffff",
                        "primary-container": "#006684",
                        "surface-tint": "#016684",
                        "tertiary": "#6b3a00",
                        "primary": "#004d64",
                        "surface-container-lowest": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-gap": "12px",
                        "card-padding": "16px",
                        "gutter": "16px",
                        "appbar-height": "64px",
                        "bottom-bar-height": "80px"
                    },
                    "fontFamily": {
                        "display-hero": ["Hanken Grotesk"],
                        "headline-sm": ["Hanken Grotesk"],
                        "caption": ["Noto Sans"],
                        "body-source-lg": ["Noto Sans"],
                        "body-target-md": ["Noto Sans"],
                        "label-mono": ["JetBrains Mono"],
                        "headline-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "display-hero": ["40px", { "lineHeight": "48px", "fontWeight": "700" }],
                        "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "body-source-lg": ["22px", { "lineHeight": "30px", "fontWeight": "400" }],
                        "body-target-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e0e3e5;
            border-radius: 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface-bright text-on-surface antialiased min-h-screen flex flex-col font-body-target-md md:pb-0">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-40 bg-surface/80 backdrop-blur-md flex justify-between items-center px-gutter h-appbar-height max-w-[600px] mx-auto left-0 right-0">
<div class="flex items-center gap-3">
<h1 class="font-headline-lg text-headline-lg font-bold text-primary">空耳聯合國</h1>
</div>
<button class="text-on-surface-variant hover:bg-surface-variant/50 p-2 rounded-full transition-colors flex items-center justify-center"><span class="material-symbols-outlined">settings</span></button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[600px] mx-auto pt-[80px] px-gutter flex flex-col gap-stack-gap">
<!-- Header Section -->
<section class="py-6 flex flex-col gap-2">
<h2 class="font-headline-sm text-headline-sm text-on-surface">用發音記住外語單字</h2>
<p class="font-body-target-md text-body-target-md text-on-surface-variant">支援多語自動偵測</p>
<div class="mt-2 inline-flex items-center gap-2 bg-primary-container/20 text-primary px-3 py-1.5 rounded-full w-fit">
<span class="material-symbols-outlined text-[18px]">bolt</span>
<span class="font-label-mono text-label-mono">今日剩餘 AI 次數：12</span>
</div>
</section>
<!-- Actions Grid / Bento -->
<section class="flex flex-col gap-stack-gap">
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary rounded-xl p-6 flex flex-col items-center justify-center gap-4 hover:opacity-90 transition-opacity active:scale-[0.98] shadow-sm relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-br from-white/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined text-[48px] fill">keyboard</span>
<span class="font-headline-sm text-headline-sm">輸入單字</span>
</button>
<!-- Secondary Actions Row -->
<div class="grid grid-cols-2 gap-stack-gap">
<button class="bg-surface-container text-on-surface rounded-xl p-5 flex flex-col items-center justify-center gap-3 hover:bg-surface-variant transition-colors border border-outline-variant/30 active:scale-[0.98]">
<span class="material-symbols-outlined text-[32px] text-primary">photo_camera</span>
<div class="flex flex-col items-center">
<span class="font-body-target-md text-body-target-md font-medium">拍照／選擇圖片</span>
<span class="font-caption text-caption text-on-surface-variant mt-1">僅手機端 OCR</span>
</div>
</button>
<button class="bg-surface-container text-on-surface rounded-xl p-5 flex flex-col items-center justify-center gap-3 hover:bg-surface-variant transition-colors border border-outline-variant/30 active:scale-[0.98]">
<span class="material-symbols-outlined text-[32px] text-primary">style</span>
<span class="font-body-target-md text-body-target-md font-medium">我的單字卡</span>
</button>
</div>
</section>
<!-- Warning Banner -->
<div class="mt-8 bg-[#8B5000]/10 border-l-4 border-status-warning p-4 rounded-r-lg flex items-start gap-3">
<span class="material-symbols-outlined text-status-warning">info</span>
<p class="font-caption text-caption text-on-surface-variant leading-relaxed">
                AI 近似音僅供記憶輔助參考，可能無法完全精確反映母語人士之標準發音。
            </p>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
</body></html>
